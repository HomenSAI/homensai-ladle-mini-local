name: Android checks and test APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -f tools/Dockerfile.check -t homensai-ladle-mini-local:check .
      - run: docker run --rm --network none --shm-size=512m --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" homensai-ladle-mini-local:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mini-Local-source-checks
          path: reports/
          if-no-files-found: error
  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle --no-daemon :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Laedle-Mini-Local-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/
            reports/
          if-no-files-found: error
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Laedle-Mini-Local-debug
          path: .
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Laedle-Mini-Local-device-results-API-${{ matrix.api-level }}
          path: reports/device-*
